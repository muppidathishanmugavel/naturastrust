<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Online Registration – Natura's Trust Marathon 2026</title>
<style>
:root{--g:#0e7a3d;--gd:#0a4f2a;--b:#0b5ea8;--o:#f59e0b;--bg:#f3faf5;--t:#12281c}
*{box-sizing:border-box;margin:0}
body{font-family:'Segoe UI','Noto Sans Tamil',system-ui,sans-serif;background:var(--bg);color:var(--t);font-size:17px;line-height:1.5}
header{background:var(--gd);color:#fff;padding:10px 16px;display:flex;align-items:center;gap:10px;font-weight:700}
header img{width:38px;height:38px;border-radius:9px;background:#fff}
header a{margin-left:auto;color:#ffe08a;font-size:.9rem;text-decoration:none}
main{max-width:560px;margin:auto;padding:20px 16px 60px}
h1{font-size:1.45rem;color:var(--gd);text-align:center;margin:6px 0 4px}
h2{font-size:1.2rem;color:var(--gd);margin-bottom:6px}
.s{text-align:center;color:#35523f;margin-bottom:18px}
.card{background:#fff;border-radius:18px;padding:18px;box-shadow:0 6px 20px #0e7a3d1c;margin-bottom:16px}
label{display:block;font-weight:600;margin-top:14px}
input[type=text],input[type=tel],input[type=number],select{width:100%;font:inherit;padding:13px;border:2px solid #cfe0d5;border-radius:12px;margin-top:6px;background:#fff}
input:focus,select:focus{outline:3px solid #f59e0b88;border-color:var(--g)}
select:disabled{background:#eef2ef}
.two{display:grid;gap:0 12px}
@media(min-width:520px){.two{grid-template-columns:1fr 1fr}}
.ev{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:6px}
.ev label{margin:0;border:2px solid #cfe0d5;border-radius:12px;padding:12px;text-align:center;cursor:pointer}
.ev input{display:none}
.ev label:has(input:checked){background:var(--g);color:#fff;border-color:var(--g)}
.info{background:#eef7f1;border-left:6px solid var(--g);border-radius:12px;padding:12px 14px;margin-top:14px;font-weight:600}
.err{background:#fdecec;border-left-color:#d33;color:#8a1c1c}
.warn{background:#fff7e0;border-left-color:var(--o);color:#6b4500}
.hide{display:none}
.chk{display:flex;gap:10px;align-items:flex-start;font-weight:600}
.chk input{width:26px;height:26px;margin:2px 0 0;flex:none}
.btn{display:block;width:100%;text-align:center;padding:16px;border:0;border-radius:14px;font:700 1.05rem inherit;font-family:inherit;cursor:pointer;text-decoration:none;background:var(--o);color:#3a2500;margin-top:16px}
.btn:disabled{opacity:.6}
.btn.g{background:var(--g);color:#fff}.btn.wa{background:#25d366;color:#053b1a}
.bib{background:#fff;border:4px solid var(--g);border-radius:18px;padding:16px;text-align:center;margin-top:14px}
.bib .bh{background:var(--g);color:#fff;margin:-16px -16px 12px;padding:10px;font-weight:800;font-size:.95rem;letter-spacing:.5px}
.bib .bn{font-size:4.2rem;font-weight:900;color:var(--b);line-height:1.05}
.bib .bl{font-size:.8rem;color:#557;font-weight:700}
.bib .nm{font-size:1.4rem;font-weight:800;margin-top:6px;word-break:break-word}
.bib .mt{color:#35523f;font-weight:600}
.bib .rg{margin:8px 0;font-weight:800;color:var(--gd)}
.bib .qr{display:flex;justify-content:center;margin:8px 0}
.bib .ft{font-size:.82rem;color:#35523f}
.out img{width:100%;border-radius:12px;margin-top:12px;border:1px solid #cfe0d5}
.out p{font-weight:600;margin-top:8px;text-align:center}
</style>
</head>

function show(id,on){$(id).classList.toggle('hide',!on)}
function ev(){return document.querySelector('input[name=event]:checked').value}
function catOf(event,age){
  if(event==='aanazhagan')return(age>=10&&age<=18)?'AZ':null;
  if(age>=3&&age<=6)return'KIDS';if(age>=7&&age<=15)return'M5';if(age>=16)return'M7';return null;
}
function refresh(){
  var e=ev(),age=parseInt($('age').value,10),g=$('gender');
  if(e==='aanazhagan'){g.value='M';g.disabled=true}else g.disabled=false;
  var c=isNaN(age)?null:catOf(e,age),fee=e==='aanazhagan'?300:200;
  $('catInfo').textContent=isNaN(age)?'Category / பிரிவு: enter age / வயதை உள்ளிடுங்கள்':(c?'Category / பிரிவு: '+CATS[c]+'  •  Fee / கட்டணம்: ₹'+fee:'Category / பிரிவு: —');
  var bad=!isNaN(age)&&!c;show('catErr',bad);
  if(bad)$('catErr').textContent=e==='aanazhagan'?'Aanazhagan is for age 10–18 (male). / ஆனழகன் போட்டி 10–18 வயது ஆண்களுக்கு மட்டும்.':'Marathon is for age 3 and above. / மாரத்தான் 3 வயது மற்றும் மேல்.';
  return !bad&&c;
}
document.querySelectorAll('input[name=event]').forEach(function(r){r.addEventListener('change',refresh)});
$('age').addEventListener('input',refresh);refresh();

function api(name,body){
  return fetch(SUPABASE_URL+'/functions/v1/'+name,{method:'POST',headers:{'Content-Type':'application/json','apikey':ANON_KEY,'Authorization':'Bearer '+ANON_KEY},body:JSON.stringify(body)})
  .then(function(r){return r.json().catch(function(){return{}}).then(function(j){if(!r.ok)throw new Error(j.error||'Server error ('+r.status+')');return j})});
}
function msg(t){$('msg').textContent=t;show('msg',!!t);if(t)$('msg').scrollIntoView({behavior:'smooth',block:'center'})}

function makeCard(e){
  var w=document.createElement('div');
  w.innerHTML='<div class="bib"><div class="bh">NATURA\'S TRUST MARATHON 2026</div><div class="bl">BIB NO</div><div class="bn"></div><div class="nm"></div><div class="mt"></div><div class="rg"></div><div class="qr"></div><div class="ft">Sun, 25 Oct 2026 • Mukkudal, Thamirabarani Riverbank</div></div><button type="button" class="btn g">📥 SAVE CARD AS IMAGE / அட்டையை படமாகச் சேமி</button><div class="out"></div>';
  var b=w.firstChild;
  b.querySelector('.bn').textContent=e.bib_no;
  b.querySelector('.nm').textContent=e.name;
  b.querySelector('.mt').textContent=(CATS[e.category]||e.category)+' • '+(e.gender==='F'?'Female':'Male')+' • Age '+e.age;
  b.querySelector('.rg').textContent=e.reg_no;
  new QRCode(b.querySelector('.qr'),{text:'NT:'+e.reg_no,width:140,height:140});
  var btn=w.querySelector('button'),out=w.querySelector('.out');
  btn.onclick=function(){
    btn.disabled=true;
    html2canvas(b,{scale:2,backgroundColor:'#ffffff'}).then(function(c){
      out.innerHTML='';var im=new Image();im.src=c.toDataURL('image/png');out.appendChild(im);
      var p=document.createElement('p');p.textContent='Long-press the image to save. / படத்தை அழுத்திப் பிடித்துச் சேமிக்கவும்.';out.appendChild(p);
      btn.disabled=false;
    }).catch(function(){btn.disabled=false;out.textContent='Could not create image. Please take a screenshot. / ஸ்கிரீன்ஷாட் எடுக்கவும்.'});
  };
  return w;
}

$('f').addEventListener('submit',function(x){
  x.preventDefault();msg('');
  var e=ev(),name=$('name').value.trim(),age=parseInt($('age').value,10),phone=$('phone').value.trim(),city=$('city').value.trim();
  var gender=e==='aanazhagan'?'M':$('gender').value;
  if(name.length<2)return msg('Enter your name. / பெயரை உள்ளிடுங்கள்.');
  if(isNaN(age))return msg('Enter your age. / வயதை உள்ளிடுங்கள்.');
  if(!refresh())return msg('Age does not fit this event. / வயது இந்த நிகழ்ச்சிக்குப் பொருந்தவில்லை.');
  if(!/^[6-9]\d{9}$/.test(phone))return msg('Enter a valid 10-digit mobile number. / சரியான 10 இலக்க எண்ணை உள்ளிடுங்கள்.');
  if(!$('consent').checked)return msg('Please tick the consent box. / ஒப்புதல் கட்டத்தைத் தேர்வு செய்யுங்கள்.');
  var btn=$('pay');btn.disabled=true;btn.textContent='Please wait… / காத்திருக்கவும்…';
  function reset(){btn.disabled=false;btn.innerHTML='PAY &amp; REGISTER / பணம் செலுத்தி பதிவு செய்'}
  api('create-order',{event:e,name:name,age:age,gender:gender,phone:phone,city:city}).then(function(o){
    var rz=new Razorpay({key:RAZORPAY_KEY_ID,amount:o.amount,currency:'INR',order_id:o.order_id,name:"Natura's Trust",
      prefill:{name:name,contact:phone},theme:{color:'#0e7a3d'},
      handler:function(res){
        btn.textContent='Confirming… / உறுதி செய்கிறோம்…';
        api('verify-payment',res).then(function(v){
          $('dout').innerHTML='';$('dout').appendChild(makeCard(v));
          show('formView',false);show('doneView',true);window.scrollTo(0,0);
        }).catch(function(er){reset();msg('Payment received but confirmation failed: '+er.message+'. Do NOT pay again. Call '+CONTACT+' with payment ID '+res.razorpay_payment_id)});
      },
      modal:{ondismiss:function(){reset();msg('Payment cancelled. / பணம் செலுத்துதல் ரத்தானது.')}}});
    rz.on('payment.failed',function(r){reset();msg('Payment failed'+(r&&r.error&&r.error.description?': '+r.error.description:'')+'. Please try again. / பணம் செலுத்தல் தோல்வி.')});
    rz.open();
  }).catch(function(er){reset();msg(er.message)});
});

$('lbtn').addEventListener('click',function(){
  var p=$('lphone').value.trim();show('lmsg',false);$('lout').innerHTML='';
  if(!/^[6-9]\d{9}$/.test(p)){$('lmsg').textContent='Enter a valid 10-digit mobile number. / சரியான எண்ணை உள்ளிடுங்கள்.';return show('lmsg',true)}
  var b=$('lbtn');b.disabled=true;
  api('get-entry',{phone:p}).then(function(j){
    b.disabled=false;var L=j.entries||[];
    if(!L.length){$('lmsg').textContent='No registration found for this number. If you paid, call '+CONTACT+'.';return show('lmsg',true)}
    L.forEach(function(e){$('lout').appendChild(makeCard(e))});
  }).catch(function(er){b.disabled=false;$('lmsg').textContent=er.message;show('lmsg',true)});
});
</script>
</body>
</html>
